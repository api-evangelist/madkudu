note: >-
  MadKudu publishes NO priced API plans. There is no tier list, no price, no published credit
  allowance and no self-serve checkout. API access is an add-on to a MadKudu/HG Insights
  subscription: "With the API access add-on you get a credit allowance. If you need more credits
  talk to your CSM." The parent company's pricing page (hginsights.com/product/pricing-guide/) is a
  contact-sales guide, not a rate card. What MadKudu DOES publish is the metering unit and the
  credit cost of each endpoint category, recorded below — that is the whole of the public
  commercial surface. MadKudu's docs also state the API is only available on request since the HG
  Insights acquisition ("Please contact HG Insights or your account manager if you're interested in
  the MadKudu API").
plans: []
metering:
  unit: credit
  model: prepaid allowance, consumed per call
  rollover: true
  rollover_note: '"Do unused credits roll over? Yes" — published FAQ.'
  exhaustion: HTTP 429 with a "credits exhausted" message.
  counted_surfaces:
  - MadAPI REST calls
  - MadMCP tool calls ("API calls made via MCP tools also count toward your usage")
  monitoring: MadKudu Admin console > Settings > API Usage (per API key and per endpoint).
