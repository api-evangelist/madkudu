actions:
- target: $.info
  update:
    description: >-
      The MadKudu Legacy Scoring API returns predictive customer fit (demographics score),
      likelihood to buy and lead grade for companies (by domain) and persons (by email), plus a
      job-changes watch list. Authentication is HTTP Basic with the API key as the username and an
      empty password. All calls must use HTTPS. Rate limited to 600 requests per endpoint per
      minute; exceeding it returns HTTP 429. MadKudu documents this surface as the "Legacy API"
      and points new integrations at MadAPI (https://madapi.madkudu.com).
    contact:
      name: MadKudu Support
      email: support@madkudu.com
      url: https://developers.madkudu.com/legacy-api
    x-documentation: https://developers.madkudu.com/legacy-api/introduction
    x-lifecycle: legacy
    x-superseded-by: https://madapi.madkudu.com
    x-rate-limit: 600 requests per endpoint per minute (HTTP 429 on exceed)
    x-official-bindings:
