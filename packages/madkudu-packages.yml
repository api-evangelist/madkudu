  languages:
  - javascript
  - typescript
  note: >-
    MadKudu publishes three first-party npm packages under the @madkudu scope. Two of them are
    client libraries for the LEGACY surface and both are stale: the Node bindings last shipped in
    2017 and the browser library in 2023, and both of their GitHub repositories are now ARCHIVED
    and were moved into the acquiring company's org (github.com/MadKudu/madkudu-node 301s to
    github.com/HGData/mk-madkudu-node). No first-party SDK exists for the current MadAPI surface
    (madapi.madkudu.com) at all — the only actively maintained package is the MCP server
    implementation. Nothing is published to PyPI, RubyGems, crates.io, Packagist, Maven Central or
    NuGet (probed 2026-08-14, all 404).
