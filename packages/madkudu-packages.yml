  note: >-
    First-party MCP server implementation. Ships a `mcp` bin and depends on
    @modelcontextprotocol/sdk; the package's own scripts run it with USE_HTTP=true against
    BASE_URL=https://madapi.madkudu.com, which is how the hosted mcp.madkudu.com endpoint is
    served. Its README documents four tools (madkudu-person-details, madkudu-account-details,
    madkudu-account-research, madkudu-account-top-users) against the twelve listed in the docs,
    so the published package trails the hosted server. The linked repository
    github.com/MadKudu/MadAPI is not public (404, probed 2026-08-14).
