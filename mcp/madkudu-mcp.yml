server:
  name: MadMCP
  transport: http
  url: https://mcp.madkudu.com/YOUR_API_KEY/mcp
  sse_url: https://mcp.madkudu.com/YOUR_API_KEY/sse
  auth: api-key-in-path
notes: 'Official hosted MadKudu MCP server ("MadMCP"). Two endpoints are published: a streamable-HTTP
  endpoint (/mcp) and an SSE endpoint (/sse) for clients not yet compatible with streamable HTTP. The
  API key is supplied as the YOUR_API_KEY path segment rather than in a header, so the credential travels
  in the URL. Documented client integrations include Claude (Anthropic), Cursor, Dust, Make, n8n, Relevance
  AI and Windsurf; ChatGPT (OpenAI) and Zapier are documented as "Coming Soon". Relevance AI is documented
  as NOT supporting MCP connections — MadKudu ships importable REST-backed tools there instead.'
deployment:
  mode: remote
  endpoint: https://mcp.madkudu.com/YOUR_API_KEY/mcp
  verified: probed
  probe: live
  checked: '2026-08-12'
  source: catalog MCP census
documented_local_bridge:
  command: npx
  args:
  - -y
  - supergateway
  - --sse
  - https://mcp.madkudu.com/YOUR_API_KEY/sse
  note: Verbatim from https://developers.madkudu.com/madkudu-mcp/install-in-ai-platforms-in-2min. This
    is a generic third-party stdio<->SSE gateway wrapping MadKudu's own remote endpoint, not a MadKudu
    package.
tools:
- name: madkudu-account-details
  entity: Account
  description: Returns enriched account information including firmographics, scoring, social handles and
    engagement stats.
- name: madkudu-account-activities
  entity: Account
  description: Get all activities associated with an account.
- name: madkudu-account-top-users
  entity: Account
  description: Lists the top users from the account based on activity volume. Useful for identifying champions
    or active contacts.
- name: madkudu-search-accounts
  entity: Account
  description: Search for accounts existing in MadKudu (your known contacts from all your integrations
    connected to MadKudu).
- name: madkudu-account-news-deep-search
  entity: Account
  description: Search for relevant news online about an account.
- name: madkudu-account-brief-instructions
  entity: Account
  description: Provides instructions as a structured prompt to generate a sales account brief, calling
    other MadMCP tools.
- name: madkudu-person-activities
  entity: Person
  description: Get all activities associated with a person.
- name: madkudu-person-details
  entity: Person
  description: Returns enriched contact information including title, persona, email, LinkedIn, scoring,
    company and engagement stats.
- name: madkudu-discover-persons
  entity: Person
  description: Finds new prospects not in your CRM based on title, seniority and company.
- name: madkudu-enrich-persons
  entity: Person
  description: Finds contact details like email and phone numbers for people discovered.
- name: madkudu-search-persons
  entity: Person
  description: Search for persons existing in MadKudu (your known contacts from all your integrations
    connected to MadKudu).
- name: madkudu-value-prop
  entity: Organization
  description: Get the value prop for your company to provide context when generating an account brief
    or personalizing email.
undocumented_tools_referenced:
