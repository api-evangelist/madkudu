note: >-
  Binds each published MadMCP tool to the MadAPI operation(s) that back it. The live MCP schemas
  are auth-gated (the API key is a path segment and tools/list requires an initialized session —
  anonymous POST returns JSON-RPC -32000), so bindings are mapped by name and by the provider's own
  tool descriptions against the OpenAPI operations MadKudu publishes in its GitBook API reference.
  Confidence is set accordingly; nothing here was invented.
