aid: madkudu
name: MadKudu
description: 'MadKudu is a predictive lead scoring and account intelligence platform for B2B sales and
  marketing teams, using AI-driven propensity modeling and dynamic scoring across fit, intent, and engagement
  signals to surface high-propensity accounts and people. Its developer surface (MadAPI) programmatically
  exposes account and person lookup, enrichment, activity, search, sourcing discovery, AI web search,
  organisation endpoints and a "coming soon" custom ingestion API, alongside a legacy Scoring API and
  a hosted Model Context Protocol (MCP) server for AI agents. MadKudu publishes OpenAPI 3.1.0 for both
  surfaces, but only as per-operation blocks embedded in its GitBook reference — no spec document is
  served. MadKudu was acquired by HG Insights in 2025; the docs are now titled "HG Platform API" and API
  access is contact-sales. Originally backed by Partech and Techstars.'
