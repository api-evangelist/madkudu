apis:
- name: MadKudu API (MadAPI)
  description: 'The current MadKudu API (MadAPI) exposes account and person lookup, full account/person
    details and activities, company hiring/job-posting enrichment, person contact enrichment, advanced
    account and person search, sourcing provider discovery, and tenant organisation/value-prop endpoints.
    Authentication is via an X-API-Key header; rate limiting is credit-based (HTTP 429 on exhaustion).'
