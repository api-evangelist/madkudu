apis:
- name: MadKudu API (MadAPI)
  description: 'The current MadKudu API (MadAPI) exposes account and person lookup, full account/person
    details and activities, company hiring/job-posting enrichment, advanced account and person search,
    prospect discovery and contact enrichment through connected sourcing providers (Apollo, Cognism,
    ZoomInfo), Tavily-backed AI web search, tenant organisation/value-prop endpoints, and a custom ingestion
    API documented as "Coming Soon" — 19 operations in all. Authentication is a raw API key in the x-api-key
    header; billing is credit-metered per call (HTTP 429 on exhaustion) with no rate-limit response headers.'
  humanURL: https://developers.madkudu.com/api
