- name: MadKudu Legacy Scoring API
  description: 'The legacy MadKudu Scoring API returns customer-fit (demographics), likelihood-to-buy
    and lead-grade scores for companies by domain and persons by email, plus a job-changes watch list
    and a ping utility — 6 operations. Authentication is HTTP Basic (API key as username, empty password)
    with a different key from MadAPI; rate limited to 600 requests per endpoint per minute (HTTP 429 when
    exceeded). MadKudu labels this surface "Legacy" and steers new integrations to MadAPI, but publishes
    no dated deprecation or sunset policy.'
  humanURL: https://developers.madkudu.com/legacy-api
