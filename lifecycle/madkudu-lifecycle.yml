  staging_host: https://madapi.wisekudu.com
  path_versioning: >-
    MadAPI paths carry no version segment at all (/lookup/accounts, /accounts/{mk_id}). The legacy
    Scoring API versions in the path (/v1/companies, /v1/persons). Both OpenAPI documents MadKudu
    publishes declare info.version "0.0.0", so there is no released API version number to pin to.
  legacy: Legacy Scoring API (https://api.madkudu.com), documented as "Legacy API" and superseded
    by MadAPI.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notes: >-
    MadKudu labels the older Scoring API as its "Legacy API" and steers new integrations to
    MadAPI, but publishes no dated deprecation or sunset policy, no RFC 8594 Sunset/Deprecation
    headers, and no end-of-life date. A legacy consumer has no published signal telling them when
    api.madkudu.com stops.
