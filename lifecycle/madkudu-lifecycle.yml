sdk_decay:
  ref: packages/madkudu-packages.yml
  note: >-
    Both first-party client libraries are stale and their repositories are archived — the Node
    bindings the Legacy API docs still link to last shipped 2017-03-24, the browser library
    2023-05-24. There is no first-party SDK for MadAPI in any language. The only actively
    maintained package is @madkudu/mcp (1.10.1, 2025-06-04).
ownership:
  parent: HG Insights
  acquired: 2025
  evidence: >-
    "MadKudu was acquired by HG Insights in 2025. Please contact HG Insights or your account
    manager if you're interested in the MadKudu API." — https://developers.madkudu.com/readme.md
  effects:
  - The developer docs are titled "HG Platform API" in the published llms.txt.
  - github.com/MadKudu now has zero public repositories; every repo 301-redirects into
    github.com/HGData/mk-* and the two SDK repos there are archived.
  - madkudu.com serves HG Insights marketing content; legal and trust pages live on
    hginsights.com.
  - Login/admin surfaces remain on madkudu.com (admin.madkudu.com, msi.madkudu.com).
